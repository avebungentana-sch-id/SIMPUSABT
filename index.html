<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS Pro - Sistem Manajemen Perpustakaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen w-full"></div>

    <script>
        const LS_KEY = 'SIMPUS_LOCAL_DATA';
        const AUTH_KEY = 'SIMPUS_LOCAL_AUTH';
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwFSU0ypESkRJfUIk6w4RlTl6-vXLgB-TDoRLvwaHLGXqN5xwNW7dpvZhBh8ie-ANtb/exec'; // TODO: Masukkan URL Web App Google Apps Script Anda di sini

        let state = {
            view: 'public', // public, login, admin
            activeTab: 'dashboard',
            activeCirculationTab: 'active-loans',
            sidebarOpen: false,
            books: [],
            members: [],
            borrows: [],
            requests: [],
            dbCategories: [],
            categoryModalOpen: false,
            settings: {
                schoolName: "Perpustakaan Utama",
                address: "Jl. Pendidikan No. 1",
                headName: "-",
                staffName: "-",
                borrowDuration: 7,
                finePerDay: 1000
            },
            user: null, 
            editingBookId: null,
            editingMemberId: null,
            bookSearch: '',
            memberSearch: '',
            
            // Search criteria configuration
            searchBy: 'title', // title, author, category
            searchQuery: '',
            categoryFilter: 'Semua',

            // Public Loan Request Form state
            requestLoanBookId: null,
            requestMemberId: '',

            // Bulk actions and history state
            selectedBooks: [],
            selectedMembers: [],
            historyModalOpen: false,
            historyMemberId: null,

            // Circulation state
            circNewBorrowOpen: false,
            
            // Backend Sync State
            isLoading: false,
            loadingMsg: ''
        };

        // Utility: Generate Unique ID
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // Utility: Date Formatter
        function formatDate(isoString) {
            if (!isoString) return '-';
            const d = new Date(isoString);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        async function initStorage() {
            const data = localStorage.getItem(LS_KEY);
            if (data) {
                const parsed = JSON.parse(data);
                state.books = parsed.books || [];
                state.members = parsed.members || [];
                state.borrows = parsed.borrows || [];
                state.requests = parsed.requests || [];
                state.dbCategories = parsed.dbCategories || [];
                if (parsed.settings) state.settings = parsed.settings;
            } else {
                // Mock Initial Data for testing
                state.books = [
                    { id: generateId(), title: 'Filosofi Teras', author: 'Henry Manampiring', category: 'Filsafat', stock: 5, shelf: 'A1', createdAt: new Date().toISOString() },
                    { id: generateId(), title: 'Atomic Habits', author: 'James Clear', category: 'Pengembangan Diri', stock: 3, shelf: 'B2', createdAt: new Date().toISOString() }
                ];
                state.members = [
                    { id: generateId(), name: 'Budi Santoso', nis: '1001', className: 'X MIPA 1' },
                    { id: generateId(), name: 'Siti Aminah', nis: '1002', className: 'XI IPS 2' }
                ];
                state.dbCategories = [
                    { id: generateId(), name: 'Filsafat' }, { id: generateId(), name: 'Pengembangan Diri' }, { id: generateId(), name: 'Fiksi' }
                ];
                saveStorage();
            }

            const auth = localStorage.getItem(AUTH_KEY);
            if (auth) {
                state.user = JSON.parse(auth);
                state.view = 'admin';
            }
            
            render(); // Tampilkan data lokal secara instan

            // Tarik data otomatis secara diam-diam hanya saat web pertama kali dibuka
            pullFromServer(false);
        }

        async function pullFromServer(isManual = false) {
            if (GAS_URL === '') {
                if (isManual) triggerAlert('Perhatian', 'URL Web App GAS belum diatur pada kode (GAS_URL).', 'error');
                return;
            }

            const executePull = async () => {
                state.isLoading = true;
                state.loadingMsg = 'Menarik data dari Server...';
                render();
                try {
                    const response = await fetch(GAS_URL);
                    const cloudData = await response.json();
                    
                    if (cloudData.books) state.books = cloudData.books;
                    if (cloudData.members) state.members = cloudData.members;
                    if (cloudData.borrows) state.borrows = cloudData.borrows;
                    if (cloudData.requests) state.requests = cloudData.requests;
                    if (cloudData.dbCategories) state.dbCategories = cloudData.dbCategories;
                    if (cloudData.settings && Object.keys(cloudData.settings).length > 0) state.settings = cloudData.settings;
                    
                    saveStorage();
                    if (isManual) triggerAlert("Berhasil", "Data lokal telah diperbarui dengan data server terbaru.", "success");
                } catch (error) {
                    console.error('GAS Fetch Error:', error);
                    if (isManual) triggerAlert("Gagal", "Koneksi ke server gagal. Periksa jaringan Anda.", "error");
                } finally {
                    state.isLoading = false;
                    render();
                }
            };

            if (isManual) {
                triggerConfirm("Tarik Data Cloud", "Tindakan ini akan menimpa data di perangkat ini dengan data dari server Google Sheets. Pastikan Anda ingin memuat ulang. Lanjutkan?", executePull);
            } else {
                executePull();
            }
        }

        function saveStorage() {
            const dataToSave = {
                books: state.books,
                members: state.members,
                borrows: state.borrows,
                requests: state.requests,
                dbCategories: state.dbCategories,
                settings: state.settings
            };
            
            // HANYA menyimpan ke local storage, MENCEGAH terjadinya auto push
            localStorage.setItem(LS_KEY, JSON.stringify(dataToSave));
        }

        async function pushToServer() {
            if (GAS_URL === '') {
                triggerAlert('Perhatian', 'URL Web App GAS belum diatur pada kode (GAS_URL).', 'error');
                return;
            }

            triggerConfirm("Push ke Cloud", "PERINGATAN: Ini akan MENIMPA seluruh data di Google Sheets Anda dengan data lokal di perangkat ini. Pastikan data lokal Anda sudah benar. Lanjutkan Push?", async () => {
                state.isLoading = true;
                state.loadingMsg = 'Menyimpan ke Cloud...';
                render();
                try {
                    const dataToSave = {
                        books: state.books, members: state.members, borrows: state.borrows,
                        requests: state.requests, dbCategories: state.dbCategories, settings: state.settings
                    };
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(dataToSave)
                    });
                    const resData = await response.json();
                    
                    if (resData.status === 'success') {
                        triggerAlert("Berhasil", "Data berhasil di-push dan tersimpan permanen di Google Sheets.", "success");
                    } else {
                        triggerAlert("Error Server", resData.message, "error");
                    }
                } catch (error) {
                    console.error("Gagal menyimpan ke GAS:", error);
                    triggerAlert("Gagal", "Gagal menghubungi server Cloud. Periksa koneksi internet Anda.", "error");
                } finally {
                    state.isLoading = false;
                    render();
                }
            });
        }

        let customAlertOpen = false;
        let customAlertData = {};
        let customConfirmOpen = false;
        let customConfirmData = {};

        function triggerAlert(title, message, type='info') {
            customAlertData = { title, message, type };
            customAlertOpen = true;
            render();
        }

        function closeAlert() {
            customAlertOpen = false;
            render();
        }

        function triggerConfirm(title, message, onConfirm) {
            customConfirmData = { title, message, onConfirm };
            customConfirmOpen = true;
            render();
        }

        function closeConfirm() {
            customConfirmOpen = false;
            render();
        }

        function executeConfirm() {
            if (customConfirmData.onConfirm) customConfirmData.onConfirm();
            closeConfirm();
        }

        function setView(v) { state.view = v; render(); }
        function setActiveTab(t) { state.activeTab = t; state.sidebarOpen = false; render(); }
        function setActiveCirculationTab(t) { state.activeCirculationTab = t; render(); }
        function toggleSidebar() { state.sidebarOpen = !state.sidebarOpen; render(); }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email === 'admin@simpus.com' && password === 'admin') {
                state.user = { email: email, name: 'Administrator' };
                localStorage.setItem(AUTH_KEY, JSON.stringify(state.user));
                state.view = 'admin';
                state.activeTab = 'dashboard';
                triggerAlert("Login Berhasil", "Selamat datang di SIMPUS Pro.", "success");
            } else {
                triggerAlert("Akses Ditolak", "Email atau kata sandi salah.", "error");
            }
        }

        function handleLogout() {
            state.user = null;
            localStorage.removeItem(AUTH_KEY);
            state.view = 'public';
            render();
        }

        function openPublicRequestModal(bookId) {
            state.requestLoanBookId = bookId;
            state.requestMemberId = '';
            render();
        }

        function closeRequestModal() {
            state.requestLoanBookId = null;
            render();
        }

        function submitPublicLoanRequest(e) {
            e.preventDefault();
            const memberInput = document.getElementById('public-req-nis').value.trim();
            if (!memberInput) { triggerAlert("Error", "Masukkan NIS atau ID Anggota.", "error"); return; }
            
            const member = state.members.find(m => m.nis === memberInput || m.id === memberInput);
            if (!member) { triggerAlert("Gagal", "Data anggota tidak ditemukan.", "error"); return; }
            
            const book = state.books.find(b => b.id === state.requestLoanBookId);
            if (!book || book.stock <= 0) { triggerAlert("Gagal", "Buku tidak tersedia.", "error"); return; }

            // Cek apakah sudah ada request pending untuk buku ini oleh user ini
            const existingReq = state.requests.find(r => r.bookId === book.id && r.memberId === member.id && r.status === 'pending');
            if (existingReq) { triggerAlert("Perhatian", "Anda sudah mengajukan peminjaman untuk buku ini.", "info"); return; }

            state.requests.push({
                id: generateId(),
                bookId: book.id,
                memberId: member.id,
                status: 'pending',
                requestDate: new Date().toISOString()
            });
            saveStorage();
            closeRequestModal();
            triggerAlert("Berhasil", "Pengajuan terkirim. Silakan ke meja petugas perpustakaan.", "success");
        }

        function renderPublicOPAC() {
            const latestBooks = [...state.books].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)).slice(0, 10);
            
            let publicBooks = state.books.filter(b => {
                let matchSearch = true;
                const q = state.searchQuery.toLowerCase();
                if (q) {
                    if (state.searchBy === 'title') matchSearch = (b.title||'').toLowerCase().includes(q);
                    else if (state.searchBy === 'author') matchSearch = (b.author||'').toLowerCase().includes(q);
                    else if (state.searchBy === 'category') matchSearch = (b.category||'').toLowerCase().includes(q);
                }
                let matchCat = state.categoryFilter === 'Semua' || b.category === state.categoryFilter;
                return matchSearch && matchCat;
            });

            const reqModal = state.requestLoanBookId ? `
            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-slide-up">
                    <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-slate-800">Ajukan Peminjaman</h3>
                        <button onclick="closeRequestModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <form onsubmit="submitPublicLoanRequest(event)" class="p-5">
                        <p class="text-sm text-slate-600 mb-4 leading-relaxed">Masukkan NIS atau ID Anggota Anda untuk meminjam buku <b class="text-indigo-600">${state.books.find(b=>b.id===state.requestLoanBookId)?.title}</b>.</p>
                        <input type="text" id="public-req-nis" value="${state.requestMemberId}" placeholder="Contoh: 1001" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 mb-5 transition-all">
                        <button type="submit" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold hover:bg-indigo-700 transition-colors shadow-md">Kirim Pengajuan</button>
                    </form>
                </div>
            </div>` : '';

            return `
            <div class="min-h-screen flex flex-col bg-slate-50">
                <nav class="glass-panel sticky top-0 z-40 border-b border-slate-200">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16 items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i data-lucide="library" class="w-6 h-6"></i></div>
                                <div><h1 class="font-bold text-lg leading-tight text-slate-800">SIMPUS ${state.settings.schoolName}</h1><p class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider">Katalog Publik</p></div>
                            </div>
                            <button onclick="setView('login')" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition-all"><i data-lucide="shield" class="w-4 h-4"></i> Admin Login</button>
                        </div>
                    </div>
                </nav>

                <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
                    <!-- Terbaru Section -->
                    ${latestBooks.length > 0 ? `
                    <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl p-8 text-white shadow-xl shadow-indigo-200 mb-10 animate-fade-in">
                        <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"><i data-lucide="sparkles" class="w-6 h-6 text-indigo-200"></i> Koleksi Tambahan Terbaru</h2>
                        <div class="flex overflow-x-auto gap-5 pb-4 hide-scrollbar snap-x">
                            ${latestBooks.map(b => `
                                <div class="min-w-[220px] max-w-[220px] bg-white/10 backdrop-blur-md border border-white/20 p-5 rounded-2xl snap-start hover:bg-white/20 transition-all cursor-default">
                                    <div class="h-32 bg-black/20 rounded-xl mb-4 flex items-center justify-center shadow-inner">
                                        <i data-lucide="book" class="w-10 h-10 text-indigo-200 opacity-80"></i>
                                    </div>
                                    <h3 class="font-bold text-lg truncate" title="${b.title}">${b.title}</h3>
                                    <p class="text-indigo-200 text-xs truncate mb-4">${b.author}</p>
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] bg-indigo-500/50 px-2.5 py-1 rounded-lg font-semibold uppercase tracking-wide">${b.category || '-'}</span>
                                        <button onclick="openPublicRequestModal('${b.id}')" class="bg-white text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-50 transition-colors shadow-sm">Pinjam</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    <!-- Katalog Utama -->
                    <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 animate-slide-up">
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-8">
                            <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2"><i data-lucide="search" class="w-5 h-5 text-indigo-500"></i> Jelajahi Katalog</h2>
                            <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                                <select onchange="state.searchBy = this.value; render()" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 font-medium text-slate-700">
                                    <option value="title" ${state.searchBy === 'title' ? 'selected' : ''}>Cari Judul Buku</option>
                                    <option value="author" ${state.searchBy === 'author' ? 'selected' : ''}>Cari Penulis</option>
                                    <option value="category" ${state.searchBy === 'category' ? 'selected' : ''}>Cari Kategori</option>
                                </select>
                                <input type="text" id="public-search" value="${state.searchQuery}" oninput="state.searchQuery = this.value; render()" placeholder="Ketik kata kunci pencarian..." class="w-full sm:w-72 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                            ${publicBooks.length > 0 ? publicBooks.map(b => `
                                <div class="border border-slate-100 rounded-2xl p-5 flex gap-4 hover:border-indigo-200 hover:shadow-md transition-all bg-white group">
                                    <div class="w-16 h-24 bg-slate-100 rounded-lg flex-shrink-0 flex items-center justify-center text-slate-400 group-hover:bg-indigo-50 group-hover:text-indigo-400 transition-colors">
                                        <i data-lucide="book-open" class="w-8 h-8"></i>
                                    </div>
                                    <div class="flex-1 min-w-0 flex flex-col justify-between">
                                        <div>
                                            <h3 class="font-bold text-slate-800 truncate text-base" title="${b.title}">${b.title}</h3>
                                            <p class="text-xs text-slate-500 truncate mt-1">${b.author}</p>
                                        </div>
                                        <div class="mt-3 flex items-center justify-between">
                                            <span class="text-[11px] font-bold ${b.stock > 0 ? 'text-emerald-700 bg-emerald-50' : 'text-rose-700 bg-rose-50'} px-2.5 py-1 rounded-md">Stok: ${b.stock}</span>
                                            ${b.stock > 0 ? `<button onclick="openPublicRequestModal('${b.id}')" class="text-indigo-600 text-xs font-bold hover:text-indigo-800 transition-colors">Ajukan Pinjam <i data-lucide="arrow-right" class="w-3 h-3 inline"></i></button>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('') : `<div class="col-span-full py-12 text-center text-slate-400 font-medium">Buku tidak ditemukan. Coba kata kunci lain.</div>`}
                        </div>
                    </div>
                </main>
                <footer class="py-6 text-center text-xs text-slate-400 font-medium">
                    &copy; ${new Date().getFullYear()} ${state.settings.schoolName}. SIMPUS Pro Local Edition.
                </footer>
            </div>
            ${reqModal}
            `;
        }

        function renderLogin() {
            return `
            <div class="min-h-screen flex items-center justify-center relative p-4 bg-slate-50">
                <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                <button onclick="setView('public')" class="absolute top-6 left-6 flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors font-bold text-sm bg-white px-4 py-2 rounded-xl shadow-sm"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Katalog</button>
                <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-xl relative z-10 border border-slate-100 animate-slide-up">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-200 mb-4 transform -rotate-6"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
                        <h2 class="text-2xl font-extrabold text-slate-800">Admin Login</h2>
                        <p class="text-sm text-slate-500 mt-2 font-medium">Sistem Manajemen Perpustakaan</p>
                    </div>
                    <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-6">
                        <p class="text-xs text-blue-800 font-semibold mb-1 flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5"></i></p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-5">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Alamat Email</label>
                            <input type="email" id="email" value="masukan email admin" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 transition-all font-medium text-slate-800" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Kata Sandi</label>
                            <input type="password" id="password" value="masukan password admin" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 transition-all font-medium text-slate-800" required>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">Masuk Panel <i data-lucide="log-in" class="w-4 h-4"></i></button>
                    </form>
                </div>
            </div>`;
        }

        function renderDashboardTab() {
            const borrowedCount = state.borrows.filter(b => b.status === 'borrowed').length;
            const recentBorrows = [...state.borrows].sort((a,b) => new Date(b.borrowDate) - new Date(a.borrowDate)).slice(0, 5);

            return `
            <div class="animate-fade-in">
                <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-6 h-6 text-indigo-600"></i> Ringkasan Sistem</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-indigo-600 text-white rounded-3xl p-6 shadow-lg shadow-indigo-200 relative overflow-hidden">
                        <i data-lucide="library" class="w-32 h-32 absolute -right-6 -bottom-6 opacity-20 transform -rotate-12"></i>
                        <p class="text-indigo-200 font-semibold mb-1 text-sm uppercase tracking-wider">Total Koleksi Buku</p>
                        <h2 class="text-5xl font-extrabold mt-2">${state.books.length} <span class="text-lg font-medium text-indigo-300">Judul</span></h2>
                    </div>
                    <div class="bg-emerald-500 text-white rounded-3xl p-6 shadow-lg shadow-emerald-200 relative overflow-hidden">
                        <i data-lucide="users" class="w-32 h-32 absolute -right-6 -bottom-6 opacity-20 transform -rotate-12"></i>
                        <p class="text-emerald-100 font-semibold mb-1 text-sm uppercase tracking-wider">Anggota Terdaftar</p>
                        <h2 class="text-5xl font-extrabold mt-2">${state.members.length} <span class="text-lg font-medium text-emerald-200">Orang</span></h2>
                    </div>
                    <div class="bg-amber-500 text-white rounded-3xl p-6 shadow-lg shadow-amber-200 relative overflow-hidden">
                        <i data-lucide="arrow-right-left" class="w-32 h-32 absolute -right-6 -bottom-6 opacity-20 transform -rotate-12"></i>
                        <p class="text-amber-100 font-semibold mb-1 text-sm uppercase tracking-wider">Buku Sedang Dipinjam</p>

        let bookModalOpen = false;

        function openBookModal(id) {
            state.editingBookId = id;
            bookModalOpen = true;
            render();
        }

        function closeBookModal() {
            state.editingBookId = null;
            bookModalOpen = false;
            render();
        }

        function saveBook(e) {
            e.preventDefault();
            const title = document.getElementById('book-title').value;
            const author = document.getElementById('book-author').value;
            const isbn = document.getElementById('book-isbn').value;
            const category = document.getElementById('book-category').value;
            const shelf = document.getElementById('book-shelf').value;
            const stock = document.getElementById('book-stock').value;

            const bookData = { title, author, isbn, category, shelf, stock: parseInt(stock), updatedAt: new Date().toISOString() };

            if (state.editingBookId) {
                const idx = state.books.findIndex(b => b.id === state.editingBookId);
                if (idx !== -1) state.books[idx] = { ...state.books[idx], ...bookData };
                triggerAlert("Berhasil", "Data buku diperbarui.", "success");
            } else {
                bookData.id = generateId();
                bookData.createdAt = new Date().toISOString();
                state.books.push(bookData);
                triggerAlert("Berhasil", "Buku baru ditambahkan.", "success");
            }
            saveStorage();
            closeBookModal();
        }

        function deleteBook(id) {
            triggerConfirm("Hapus Buku", "Yakin ingin menghapus buku ini secara permanen?", () => {
                state.books = state.books.filter(b => b.id !== id);
                saveStorage();
                triggerAlert("Dihapus", "Buku berhasil dihapus.", "success");
            });
        }

        function toggleAllBooks(checked) {
            if (checked) {
                const filtered = state.books.filter(b => (b.title || '').toLowerCase().includes(state.bookSearch.toLowerCase()) || (b.author || '').toLowerCase().includes(state.bookSearch.toLowerCase()));
                state.selectedBooks = filtered.map(b => b.id);
            } else state.selectedBooks = [];
            render();
        }

        function toggleBookSelection(id, checked) {
            if (checked && !state.selectedBooks.includes(id)) state.selectedBooks.push(id);
            else state.selectedBooks = state.selectedBooks.filter(item => item !== id);
            render();
        }

        function bulkDeleteBooks() {
            triggerConfirm("Hapus Massal", `Hapus permanen ${state.selectedBooks.length} buku terpilih?`, () => {
                state.books = state.books.filter(b => !state.selectedBooks.includes(b.id));
                state.selectedBooks = [];
                saveStorage();
                triggerAlert("Selesai", "Buku terpilih telah dihapus.", "success");
            });
        }

            } else state.selectedMembers = [];
            render();
        }

        function toggleMemberSelection(id, checked) {
            if (checked && !state.selectedMembers.includes(id)) state.selectedMembers.push(id);
            else state.selectedMembers = state.selectedMembers.filter(item => item !== id);
            render();
        }

        function bulkDeleteMembers() {
            triggerConfirm("Hapus Massal", `Hapus permanen ${state.selectedMembers.length} anggota terpilih?`, () => {
                state.members = state.members.filter(m => !state.selectedMembers.includes(m.id));
                state.selectedMembers = [];
                saveStorage();
                triggerAlert("Selesai", "Anggota terpilih telah dihapus.", "success");
            });
        }

        function openHistoryModal(id) {
            state.historyMemberId = id;
            state.historyModalOpen = true;
            render();
        }

        function closeHistoryModal() {
            state.historyModalOpen = false;
            render();
        }

        function downloadMemberHistory(memberId) {
            const member = state.members.find(m => m.id === memberId);
            const memberBorrows = state.borrows.filter(b => b.memberId === memberId).sort((a,b) => new Date(b.borrowDate) - new Date(a.borrowDate));
            
            let csv = "data:text/csv;charset=utf-8,Judul Buku,Tanggal Pinjam,Tanggal Kembali,Status\n";
            memberBorrows.forEach(b => {
                const book = state.books.find(bk => bk.id === b.bookId) || { title: 'Dihapus' };
                csv += `"${book.title}",${formatDate(b.borrowDate)},${b.returnDate ? formatDate(b.returnDate) : '-'},${b.status === 'returned' ? 'Dikembalikan' : 'Dipinjam'}\n`;
            });
            
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `Riwayat_${member ? member.nis : 'Anggota'}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderAnggotaTab() {
            const filtered = state.members.filter(m => {
                return (m.name || '').toLowerCase().includes(state.memberSearch.toLowerCase()) || 
                       (m.nis || '').toLowerCase().includes(state.memberSearch.toLowerCase());
            });

            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-slate-800">${state.editingMemberId ? 'Ubah Anggota' : 'Tambah Anggota'}</h3>
                        <button onclick="closeMemberModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>

                        <div><label class="block text-sm font-bold text-slate-700 mb-1">NIS / ID</label><input type="text" id="member-nis" value="${current.nis}" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"></div>
                        <div><label class="block text-sm font-bold text-slate-700 mb-1">Kelas / Unit</label><input type="text" id="member-class" value="${current.className}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"></div>
                        <div class="pt-4 flex justify-end gap-3"><button type="button" onclick="closeMemberModal()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold text-slate-700">Batal</button><button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-sm font-bold text-white shadow-md">Simpan</button></div>
                    </form>
                </div>
            </div>` : '';

            let historyUI = '';
            if (state.historyModalOpen && state.historyMemberId) {
                const member = state.members.find(m => m.id === state.historyMemberId);
                const memBorrows = state.borrows.filter(b => b.memberId === state.historyMemberId).sort((a,b) => new Date(b.borrowDate) - new Date(a.borrowDate));
                historyUI = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[80vh]">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <div><h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-indigo-600"></i> Riwayat Pinjam</h3><p class="text-xs text-slate-500 font-bold mt-1">${member?.name} (NIS: ${member?.nis})</p></div>
                            <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="overflow-y-auto p-0 flex-1">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-white sticky top-0 shadow-sm z-10 border-b border-slate-100"><tr class="text-slate-500 font-bold"><th class="px-4 py-3">Buku</th><th class="px-4 py-3">Pinjam</th><th class="px-4 py-3">Kembali</th><th class="px-4 py-3">Status</th></tr></thead>
                                <tbody>
                                    ${memBorrows.map(b => {
                                        const bk = state.books.find(x => x.id === b.bookId) || {title:'Dihapus'};
                                        return `<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="px-4 py-3 font-semibold text-slate-700">${bk.title}</td><td class="px-4 py-3 text-slate-500">${formatDate(b.borrowDate)}</td><td class="px-4 py-3 text-slate-500">${formatDate(b.returnDate)}</td><td class="px-4 py-3"><span class="px-2 py-1 rounded text-[10px] font-bold ${b.status==='returned'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}">${b.status==='returned'?'Dikembalikan':'Dipinjam'}</span></td></tr>`
                                    }).join('')}
                                    ${memBorrows.length===0 ? '<tr><td colspan="4" class="p-8 text-center text-slate-400">Belum ada riwayat.</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                            <button onclick="downloadMemberHistory('${member?.id}')" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold hover:bg-emerald-700 flex items-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> Ekspor CSV</button>
                        </div>
                    </div>
                </div>`;
            }

            return `
            <div class="animate-fade-in">
                <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="users" class="w-6 h-6 text-indigo-600"></i> Data Anggota</h2>
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="relative w-full sm:w-80">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" value="${state.memberSearch}" oninput="state.memberSearch = this.value; render()" placeholder="Cari nama / NIS..." class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <button onclick="openMemberModal(null)" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i> Tambah</button>
                    </div>
                    ${state.selectedMembers.length > 0 ? `
                    <div class="bg-indigo-50 px-6 py-3 flex justify-between items-center border-b border-indigo-100">
                        <span class="text-sm font-bold text-indigo-800">${state.selectedMembers.length} dipilih</span>
                        <div class="flex gap-2">
                            <button onclick="printMemberCards(state.selectedMembers)" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm"><i data-lucide="printer" class="w-3.5 h-3.5 inline mr-1"></i>Cetak Kartu</button>
                            <button onclick="bulkDeleteMembers()" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm">Hapus Terpilih</button>
                        </div>
                    </div>` : ''}
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 font-bold">
                                <tr>
                                    <th class="px-6 py-3 w-12"><input type="checkbox" onclick="toggleAllMembers(this.checked)" ${allSelected ? 'checked' : ''} class="w-4 h-4 rounded cursor-pointer accent-indigo-600"></th>
                                    <th class="px-6 py-3">Nama Anggota</th>
                                    <th class="px-6 py-3">NIS</th>
                                    <th class="px-6 py-3">Kelas</th>
                                    <th class="px-6 py-3 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${filtered.map(m => `
                                <tr class="hover:bg-slate-50 ${state.selectedMembers.includes(m.id) ? 'bg-indigo-50/30' : ''}">
                                    <td class="px-6 py-4"><input type="checkbox" value="${m.id}" onchange="toggleMemberSelection('${m.id}', this.checked)" ${state.selectedMembers.includes(m.id) ? 'checked' : ''} class="w-4 h-4 rounded cursor-pointer accent-indigo-600"></td>
                                    <td class="px-6 py-4 font-bold text-slate-800">${m.name}</td>
                                    <td class="px-6 py-4 font-mono text-slate-500">${m.nis}</td>
                                    <td class="px-6 py-4 text-slate-600">${m.className || '-'}</td>
                                    <td class="px-6 py-4 text-right space-x-2">
                                        <button onclick="printMemberCards(['${m.id}'])" class="text-indigo-500 hover:text-indigo-700" title="Cetak Kartu"><i data-lucide="printer" class="w-4.5 h-4.5 inline"></i></button>
                                        <button onclick="openHistoryModal('${m.id}')" class="text-amber-500 hover:text-amber-700" title="Riwayat"><i data-lucide="clock" class="w-4.5 h-4.5 inline"></i></button>
                                        <button onclick="openMemberModal('${m.id}')" class="text-blue-500 hover:text-blue-700" title="Edit"><i data-lucide="edit" class="w-4.5 h-4.5 inline"></i></button>
                                        <button onclick="deleteMember('${m.id}')" class="text-rose-500 hover:text-rose-700" title="Hapus"><i data-lucide="trash" class="w-4.5 h-4.5 inline"></i></button>
                                    </td>
                                </tr>`).join('')}
                                ${filtered.length === 0 ? '<tr><td colspan="5" class="py-12 text-center text-slate-400">Anggota tidak ditemukan.</td></tr>' : ''}

                        </table>

                </div>
                ${modalUI}
                ${historyUI}
            </div>`;
        }

        function processRequest(reqId, action) {
            const req = state.requests.find(r => r.id === reqId);
            if (!req) return;
            const book = state.books.find(b => b.id === req.bookId);

            if (action === 'approve') {
                if (!book || book.stock <= 0) { triggerAlert("Gagal", "Stok buku habis.", "error"); return; }
                book.stock -= 1;
                state.borrows.push({
                    id: generateId(), bookId: req.bookId, memberId: req.memberId,
                    borrowDate: new Date().toISOString(), status: 'borrowed'
                });
                req.status = 'approved';
                triggerAlert("Disetujui", "Pengajuan berhasil diproses.", "success");
            } else {
                req.status = 'rejected';
            }
            saveStorage();
            render();
        }

        function returnBook(borrowId) {
            const borrow = state.borrows.find(b => b.id === borrowId);
            if (!borrow) return;

            let confirmMessage = "Konfirmasi pengembalian buku ini?";
            
            // Kalkulasi denda jika terlambat
            const today = new Date();
            today.setHours(0,0,0,0);
            const dueDateObj = new Date(borrow.borrowDate);
            dueDateObj.setDate(dueDateObj.getDate() + (state.settings.borrowDuration || 7));
            dueDateObj.setHours(0,0,0,0);
            
            if (today > dueDateObj) {
                const diffTime = Math.abs(today - dueDateObj);
                const lateDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const fine = lateDays * (state.settings.finePerDay || 0);
                if (fine > 0) {
                    confirmMessage = `Buku ini terlambat <b class="text-rose-600">${lateDays} hari</b>.<br><b class="text-rose-600 text-lg">Total Denda: Rp ${fine.toLocaleString('id-ID')}</b><br><br>Peringatkan anggota dan konfirmasi pengembalian?`;
                }
            }

            triggerConfirm("Pengembalian Buku", confirmMessage, () => {
                if (borrow.status === 'borrowed') {
                    borrow.status = 'returned';
                    borrow.returnDate = new Date().toISOString();
                    const book = state.books.find(b => b.id === borrow.bookId);
                    if (book) book.stock += 1;
                    saveStorage();
                    triggerAlert("Berhasil", "Buku dikembalikan ke rak.", "success");
                }
            });
        }

        function executeBorrowBook(e) {
            e.preventDefault();
            const mId = document.getElementById('circ-member').value;
            const bId = document.getElementById('circ-book').value;

            if (!mId || !bId) { triggerAlert("Error", "Pilih anggota dan buku dari saran *autocomplete*.", "error"); return; }
            const book = state.books.find(b => b.id === bId);
            if (!book || book.stock <= 0) { triggerAlert("Gagal", "Buku tidak tersedia.", "error"); return; }

            book.stock -= 1;
            state.borrows.push({
                id: generateId(), bookId: bId, memberId: mId,
                borrowDate: new Date().toISOString(), status: 'borrowed'
            });
            saveStorage();
            state.circNewBorrowOpen = false;
            triggerAlert("Berhasil", "Peminjaman dicatat.", "success");
        }

        // Autocomplete functions
        function filterCircMember(val) {
            const dropdown = document.getElementById('circ-member-dropdown');
            document.getElementById('circ-member').value = "";
            if (!val) { dropdown.classList.add('hidden'); return; }
            
            const matches = state.members.filter(m => 
                (m.name||'').toLowerCase().includes(val.toLowerCase()) || 
                (m.nis||'').toLowerCase().includes(val.toLowerCase()) ||
                (m.id||'').toLowerCase().includes(val.toLowerCase())
            ).slice(0,5);
            dropdown.innerHTML = matches.map(m => {
                const safeName = m.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                return `<div onclick="document.getElementById('circ-member').value='${m.id}'; document.getElementById('circ-member-search').value='${safeName}'; document.getElementById('circ-member-dropdown').classList.add('hidden');" class="p-3 hover:bg-slate-50 cursor-pointer text-sm border-b border-slate-100"><p class="font-bold">${m.name}</p><p class="text-[10px] text-slate-500">NIS: ${m.nis} | ID: ${m.id}</p></div>`;
            }).join('') || '<div class="p-3 text-sm text-slate-400">Tidak ditemukan</div>';
            dropdown.classList.remove('hidden');
        }

        function filterCircBook(val) {
            const dropdown = document.getElementById('circ-book-dropdown');
            document.getElementById('circ-book').value = "";
            if (!val) { dropdown.classList.add('hidden'); return; }
            
            const matches = state.books.filter(b => 
                (b.title||'').toLowerCase().includes(val.toLowerCase()) || 
                (b.id||'').toLowerCase().includes(val.toLowerCase())
            ).slice(0,5);
            dropdown.innerHTML = matches.map(b => {
                const safeTitle = b.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                if (b.stock <= 0) return `<div class="p-3 text-sm border-b border-slate-100 opacity-50 cursor-not-allowed"><p class="font-bold line-clamp-1">${b.title}</p><p class="text-[10px] text-rose-500">Stok Habis | ID: ${b.id}</p></div>`;
                return `<div onclick="document.getElementById('circ-book').value='${b.id}'; document.getElementById('circ-book-search').value='${safeTitle}'; document.getElementById('circ-book-dropdown').classList.add('hidden');" class="p-3 hover:bg-slate-50 cursor-pointer text-sm border-b border-slate-100"><p class="font-bold line-clamp-1">${b.title}</p><p class="text-[10px] text-emerald-600">Stok: ${b.stock} | ID: ${b.id}</p></div>`;
            }).join('') || '<div class="p-3 text-sm text-slate-400">Tidak ditemukan</div>';
            dropdown.classList.remove('hidden');
        }

        function renderSirkulasiTab() {
            let innerContent = "";
            if (state.activeCirculationTab === 'active-loans') {
                const activeBorrows = state.borrows.filter(b => b.status === 'borrowed').sort((a,b) => new Date(b.borrowDate) - new Date(a.borrowDate));
                innerContent = `
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                            <tr><th class="px-6 py-3">Buku</th><th class="px-6 py-3">Peminjam</th><th class="px-6 py-3">Waktu & Status Keterlambatan</th><th class="px-6 py-3 text-right">Aksi</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${activeBorrows.map(b => {
                                const book = state.books.find(bk => bk.id === b.bookId) || {title:'-'};
                                const mem = state.members.find(m => m.id === b.memberId) || {name:'-'};
                                
                                // Kalkulasi Keterlambatan Berdasarkan Pengaturan
                                const today = new Date();
                                today.setHours(0,0,0,0);
                                const dueDateObj = new Date(b.borrowDate);
                                dueDateObj.setDate(dueDateObj.getDate() + (state.settings.borrowDuration || 7));
                                dueDateObj.setHours(0,0,0,0);
                                
                                let lateStatusHtml = '';
                                if (today > dueDateObj) {
                                    const diffTime = Math.abs(today - dueDateObj);
                                    const lateDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    const fine = lateDays * (state.settings.finePerDay || 0);
                                    lateStatusHtml = `<p class="text-[10px] text-rose-600 font-bold mt-1 bg-rose-50 px-2 py-0.5 rounded inline-block border border-rose-100 animate-pulse">Terlambat ${lateDays} hari (Rp${fine.toLocaleString('id-ID')})</p>`;
                                } else {
                                    const diffTime = Math.abs(dueDateObj - today);
                                    const remainDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                                    lateStatusHtml = `<p class="text-[10px] text-emerald-600 font-bold mt-1 bg-emerald-50 px-2 py-0.5 rounded inline-block border border-emerald-100">Sisa ${remainDays} hari</p>`;
                                }

                                return `
                                <tr class="hover:bg-slate-50">
                                    <td class="px-6 py-4 font-semibold text-slate-800">${book.title}</td>
                                    <td class="px-6 py-4 text-slate-600">${mem.name}</td>
                                    <td class="px-6 py-4 text-slate-500">
                                        <div class="text-xs">Dipinjam: ${formatDate(b.borrowDate)}</div>
                                        <div class="text-xs font-semibold text-slate-700">Tenggat: ${formatDate(dueDateObj.toISOString())}</div>
                                        ${lateStatusHtml}
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button onclick="returnBook('${b.id}')" class="px-4 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold rounded-lg text-xs transition-colors">Kembalikan</button>
                                    </td>
                                </tr>`;
                            }).join('')}
                            ${activeBorrows.length === 0 ? '<tr><td colspan="4" class="py-12 text-center text-slate-400">Tidak ada peminjaman aktif.</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>`;
            } else {
                const pending = state.requests.filter(r => r.status === 'pending');
                innerContent = `
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                            <tr><th class="px-6 py-3">Buku (Pengajuan)</th><th class="px-6 py-3">Pemohon</th><th class="px-6 py-3">Waktu</th><th class="px-6 py-3 text-right">Aksi</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${pending.map(r => {
                                const book = state.books.find(bk => bk.id === r.bookId) || {title:'-'};
                                const mem = state.members.find(m => m.id === r.memberId) || {name:'-'};
                                return `
                                <tr class="hover:bg-slate-50">
                                    <td class="px-6 py-4 font-semibold text-slate-800">${book.title}</td>
                                    <td class="px-6 py-4 text-slate-600">${mem.name}</td>
                                    <td class="px-6 py-4 text-slate-500">${formatDate(r.requestDate)}</td>
                                    <td class="px-6 py-4 text-right space-x-2">
                                        <button onclick="processRequest('${r.id}', 'approve')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700"><i data-lucide="check" class="w-3.5 h-3.5 inline"></i> Setujui</button>
                                        <button onclick="processRequest('${r.id}', 'reject')" class="px-3 py-1.5 bg-rose-100 text-rose-700 rounded-lg text-xs font-bold hover:bg-rose-200"><i data-lucide="x" class="w-3.5 h-3.5 inline"></i> Tolak</button>
                                    </td>
                                </tr>`;
                            }).join('')}
                            ${pending.length === 0 ? '<tr><td colspan="4" class="py-12 text-center text-slate-400">Tidak ada pengajuan pending.</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>`;
            }

            const manualModal = state.circNewBorrowOpen ? `
            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h3 class="font-bold text-slate-800">Pinjam Manual (Autocomplete)</h3><button onclick="state.circNewBorrowOpen=false; render()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                    <form onsubmit="executeBorrowBook(event)" class="p-6 space-y-5">

        function exportCSV(type) {
            let csv = '';
            let filename = '';
            if (type === 'books') {
                csv = "ID,Judul,Penulis,ISBN,Kategori,Rak,Stok\n";
                state.books.forEach(b => {
                    csv += `"${b.id}","${b.title}","${b.author}","${b.isbn||''}","${b.category||''}","${b.shelf||''}","${b.stock}"\n`;
                });
                filename = 'Data_Buku.csv';
            } else if (type === 'members') {
                csv = "ID,Nama,NIS,Kelas\n";
                state.members.forEach(m => {
                    csv += `"${m.id}","${m.name}","${m.nis}","${m.className||''}"\n`;
                });
                filename = 'Data_Anggota.csv';
            }
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importCSV(input, type) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                let count = 0;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    // Regex dasar untuk memecah CSV dan mengabaikan koma di dalam kutipan ganda
                    const row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim());
                    
                    if (type === 'books' && row.length >= 7) {
                        state.books.push({
                            id: row[0] || generateId(), title: row[1], author: row[2],
                            isbn: row[3], category: row[4], shelf: row[5], stock: parseInt(row[6]) || 0,
                            createdAt: new Date().toISOString()
                        });
                        count++;
                    } else if (type === 'members' && row.length >= 3) {
                        state.members.push({
                            id: row[0] || generateId(), name: row[1], nis: row[2], className: row[3] || '',
                            createdAt: new Date().toISOString()
                        });
                        count++;
                    }
                }
                saveStorage();
                triggerAlert('Impor Selesai', `${count} data berhasil ditambahkan.`, 'success');
                input.value = ''; 
                render();
            };
            reader.readAsText(file);
        }

            // Append Modals
            let modals = '';
            if (customAlertOpen) {
                modals += `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-slide-up text-center p-6 border-t-4 ${customAlertData.type==='success'?'border-emerald-500':customAlertData.type==='error'?'border-rose-500':'border-indigo-500'}">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 ${customAlertData.type==='success'?'bg-emerald-100 text-emerald-600':customAlertData.type==='error'?'bg-rose-100 text-rose-600':'bg-indigo-100 text-indigo-600'}">
                            <i data-lucide="${customAlertData.type==='success'?'check-circle':customAlertData.type==='error'?'alert-triangle':'info'}" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2">${customAlertData.title}</h3>
                        <p class="text-sm text-slate-500 mb-6">${customAlertData.message}</p>
                        <button onclick="closeAlert()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl transition-colors">Tutup</button>
                    </div>
                </div>`;
            }
            if (customConfirmOpen) {
                modals += `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-slide-up p-6">
                        <h3 class="text-lg font-bold text-slate-800 mb-2">${customConfirmData.title}</h3>
                        <p class="text-sm text-slate-500 mb-6">${customConfirmData.message}</p>
                        <div class="flex gap-3">
                            <button onclick="closeConfirm()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">Batal</button>
                            <button onclick="executeConfirm()" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition-colors shadow-md">Ya, Lanjutkan</button>
                        </div>
                    </div>
                </div>`;
            }

            if (state.isLoading) {
                modals += `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl px-8 py-6 flex flex-col items-center justify-center animate-slide-up border border-slate-100">
                        <svg class="animate-spin h-10 w-10 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <h3 class="text-sm font-bold text-slate-800 text-center">${state.loadingMsg || 'Memproses...'}</h3>
                    </div>
                </div>`;
            }

            appDiv.innerHTML = html + modals;

            // Restore Focus safely
            if (activeElementId) {
                const el = document.getElementById(activeElementId);
                if (el) {
                    el.focus();
                    try {
                        if (activeSelectionStart !== null && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
                            el.setSelectionRange(activeSelectionStart, activeSelectionStart);
                        }
                    } catch (e) {} // Ignore for specific input types
                }
            }
            
            lucide.createIcons();
        }

        // Boot
        window.onload = () => {
            initStorage();
            render();
        };
    </script>
</body>
</html>
